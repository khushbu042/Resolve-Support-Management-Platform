# docker-compose.yml
services:
  
  # ── Our FastAPI Application ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support_managment_api
    ports:
      - "8000:8000"
    volumes:
      # Hot reload - code changes reflect immediately
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/SLA-escalation-manager
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # ── Our PostgreSQL Database ───────────────────────────────
  db:
    image: postgres:15
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  # ── Our RabbitMQ Message Broker ─────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # ── Our Mailhog Email Testing Service ─────────────────────────────
  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app_network

  # ── Our Notification Worker ─────────────────────────────
  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/.venv
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_FROM=noreply@localhost
      - SMTP_USE_TLS=false
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailhog:
        condition: service_started
    command: uv run python -m app.workers.run
    networks:
      - app_network

  # ── Our Redis Cache ─────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network


# ── Named Volumes (data persists between restarts) ───────────
volumes:
  postgres_data:

# ── Networks (allows containers to communicate with each other) ───────────
networks:
  app_network:
